[project]
name = "kunko-judge-audit"
version = "0.4.0"
description = "Independent calibration audits for AI judges: is the confidence honest, what can you automate, what does it cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kunko AI Labs" }]
keywords = [
    "ai-judge", "llm-as-judge", "calibration", "ece", "selective-prediction",
    "evaluation", "ai-act", "governance", "jev", "typesafe", "shadow-mode",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kunko-ai-labs/judge-audit"
Repository = "https://github.com/kunko-ai-labs/judge-audit"
Documentation = "https://github.com/kunko-ai-labs/judge-audit/tree/main/docs"
Changelog = "https://github.com/kunko-ai-labs/judge-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/kunko-ai-labs/judge-audit/issues"
Security = "https://github.com/kunko-ai-labs/judge-audit/blob/main/SECURITY.md"

[project.scripts]
judge-audit = "judge_audit.cli:main"
judge-audit-mcp = "judge_audit.mcp_server:main"

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
anthropic = ["anthropic>=1.0"]
mcp = ["mcp>=2.0"]
nli = ["transformers>=4.40", "torch>=2.2"]
# mlx-lm pulls in mlx on macOS only; its `cpu` extra brings the Linux CPU build.
mlx = ["mlx-lm>=0.31", "mlx-lm[cpu]>=0.31; platform_system == 'Linux'"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "matplotlib>=3.7", "mcp>=2.0", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_audit"]

[tool.hatch.build.targets.sdist]
# The third-party datasets keep their own CC BY licences; the Apache-2.0 sdist leaves them
# out, and their tests skip without them.
exclude = ["src/judge_audit/judges/bridge/node_modules", "examples/banking77",
           "examples/clinc150"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
# Static types on the package itself (US-004-017); scripts/ stay lint-only.
files = ["src/judge_audit"]
ignore_missing_imports = true   # torch, transformers, anthropic, mcp ship partial or no stubs
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/judge_audit/report.py" = ["E501"]  # inline HTML/CSS template
"scripts/*" = ["E501"]                  # long human-readable strings
"examples/*" = ["E501"]                 # dataset templates
