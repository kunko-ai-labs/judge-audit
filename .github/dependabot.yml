version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init, analyze and upload-sarif must run the same version: one bump alone fails
      # with "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
