# Release: on a v* tag, build sdist + wheel, attest their provenance (Sigstore),
# smoke-test the built wheel in a clean runner, generate and attach an SBOM,
# attach everything to the GitHub release and publish to PyPI via Trusted
# Publishing (no API token stored anywhere; PyPI trusts this workflow's OIDC
# identity). Publishing only runs if the smoke test passes.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach artifacts to the release
      id-token: write        # Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release if the tag was pushed without one, then attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  smoke:
    name: Wheel smoke test + SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the SBOM to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the built wheel in a clean virtual environment
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/pip install -q "$(ls dist/*.whl)[mcp]"
      - name: judge-audit --version must equal the tag
        run: |
          got="$(smoke-venv/bin/judge-audit --version)"
          want="judge-audit ${GITHUB_REF_NAME#v}"
          echo "$got"
          test "$got" = "$want" || { echo "::error::judge-audit --version printed '$got', tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Simulated run against the packaged CLI
        run: smoke-venv/bin/judge-audit run examples/email-routing/labels.jsonl --judge simulated
      - name: MCP entry point starts from the wheel alone
        run: smoke-venv/bin/judge-audit-mcp --help
      - name: Generate an SBOM from the built wheel (CycloneDX, pinned tool)
        run: |
          pip install -q "cyclonedx-bom==7.4.0"
          cyclonedx-py environment --of JSON -o sbom.cdx.json --sv 1.6 smoke-venv
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json --clobber

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi        # create it in Settings > Environments; PyPI trusted publisher points here
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
