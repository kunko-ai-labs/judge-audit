name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ examples/
      - name: Types (mypy, the package)
        run: mypy
      - name: Test (pytest)
        run: pytest -q
      - name: Smoke — audit with the simulated judge, no key needed
        run: |
          judge-audit --version
          judge-audit-mcp --help > /dev/null
          judge-audit run examples/email-routing/labels.jsonl --judge simulated --json baseline.json
          judge-audit run examples/email-routing/labels.jsonl --judge simulated --format html --out report.html
          test -s audit-report.md && test -s report.html && test -s audit-judgments.jsonl
      - name: Exit-code contract with the installed binary
        run: |
          expect() { want=$1; shift; rc=0; "$@" || rc=$?; [ "$rc" -eq "$want" ] || { echo "expected exit $want, got $rc: $*"; exit 1; }; }
          expect 0 judge-audit check examples/email-routing/labels.jsonl --judge simulated --baseline baseline.json
          expect 2 judge-audit run does-not-exist.jsonl --judge simulated
          expect 2 judge-audit run examples/email-routing/labels.jsonl --judge jev
          echo '{"ece": 0.0, "accuracy": 1.0}' > strict.json
          expect 1 judge-audit check examples/email-routing/labels.jsonl --judge simulated --baseline strict.json
          echo '{}' > empty.json
          expect 2 judge-audit check examples/email-routing/labels.jsonl --judge simulated --baseline empty.json
      - name: Published audits recompute from their raw checkpoints
        run: |
          python scripts/verify_published.py
      - name: README tables are the committed JSON, rounded
        run: |
          python scripts/verify_readme.py
      - name: Arena table recomputes from its checkpoints
        run: |
          python scripts/arena_report.py
          git diff --exit-code -- docs/arena-2026-09.md docs/arena-2026-09.json
      - name: Per-run reports recompute from their checkpoints (curves, zero-error, intervals)
        run: |
          python scripts/runs_report.py
          git diff --exit-code -- docs/runs docs/audit-jev-real.json
      - name: Adversarial audit page recomputes from its checkpoint (the whole document)
        run: |
          python scripts/analyze_adversarial.py
          git diff --exit-code -- docs/audit-jev-adversarial.md docs/audit-jev-adversarial.json
      - name: Distinct-text robustness report recomputes from the Arena checkpoints
        run: |
          python scripts/distinct_report.py
          git diff --exit-code -- docs/robustness-distinct-2026-09.md docs/robustness-distinct-2026-09.json
      - name: Repeat runs report recomputes from its checkpoints (pre-registered predictions)
        run: |
          python scripts/repeats_report.py
          git diff --exit-code -- docs/repeats-2026-09.md docs/repeats-2026-09.json
      - name: Router audits recompute from their checkpoints
        run: |
          python scripts/audit_router.py examples/task-routing/labels.jsonl --checkpoint docs/runs/audit-jev-router.ckpt.jsonl --out docs/audit-jev-router.md --json docs/audit-jev-router.json
          python scripts/audit_router.py examples/task-routing/labels-described.jsonl --checkpoint docs/runs/audit-jev-router-described.ckpt.jsonl --out docs/audit-jev-router-described.md --json docs/audit-jev-router-described.json
          git diff --exit-code -- docs/audit-jev-router.md docs/audit-jev-router.json docs/audit-jev-router-described.md docs/audit-jev-router-described.json
      - name: Held-out report recomputes from the same checkpoints on the pre-registered split
        run: |
          python scripts/heldout_report.py
          git diff --exit-code -- docs/finetuned-baseline-2026-09.md docs/finetuned-baseline-2026-09.json
      - name: Every checkpoint answers every labelled question once (no shrunken denominator)
        run: python scripts/check_complete.py
      - name: Checkpoint decisions match the current parser (no silent re-parse debt)
        run: python scripts/reparse_checkpoints.py --dry-run | tee /tmp/reparse.txt && grep -q '^0 judgment' /tmp/reparse.txt
      - name: Consensus and jury tables recompute from their checkpoints
        run: |
          python scripts/consensus_report.py
          python scripts/jury_report.py
          python scripts/jury_deliberate.py --check
          git diff --exit-code -- docs/consensus-2026-09.md docs/consensus-2026-09.json docs/jury-consensus.md docs/jury-consensus.json

  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Datasets are reproducible from their seeded generators
        run: |
          for d in email-routing email-routing-adversarial task-routing; do
            (cd examples/$d && python generate.py >/dev/null)
          done
          git diff --exit-code -- examples/
      - name: Third-party datasets regenerate from their pinned upstream files
        run: python scripts/fetch_real_datasets.py --check
      - name: Pre-registered held-out split regenerates byte-identical
        run: |
          pip install -e .
          python scripts/split_heldout.py --check
